name: Historia de usuario
description: Funcionalidad visible para el usuario.
title: "[Historia] "
labels: ["historia"]
body:
  - type: dropdown
    id: epica
    attributes:
      label: Epica
      options:
        - Usuarios
        - Perfil
        - Servidores
        - Canales
        - Mensajeria
        - Canal de Voz
        - Roles y Permisos
        - Monetizacion
        - Moderacion
        - Administracion
        - Notificaciones
    validations: { required: true }

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options: [Obligatoria, Optativa]
    validations: { required: true }

  - type: input
    id: puntos
    attributes:
      label: Puntos
      placeholder: "3"
    validations: { required: true }

  - type: textarea
    id: historia
    attributes:
      label: Historia
      placeholder: "Como ... quiero ... para ..."
    validations: { required: true }

  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptacion
      value: |
        - [ ]
        - [ ]
    validations: { required: true }

  - type: textarea
    id: depende
    attributes:
      label: Depende de
