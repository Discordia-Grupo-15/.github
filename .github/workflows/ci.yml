name: CI

on:
  pull_request:
  # develop is where work lands, so it needs CI too: without it a merge that
  # breaks the branch goes unnoticed until someone opens the next pull request.
  push:
    branches: [main, develop]

jobs:
  secrets:
    uses: ./.github/workflows/secrets-scan.yml

  deploy-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
