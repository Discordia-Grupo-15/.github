name: CI Go

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: "1.26"
      coverage-threshold:
        type: number
        default: 60
      gitleaks-version:
        type: string
        default: "8.30.1"
      # Starts a disposable Redis for the tests that need a real one (the
      # gateway's access projection and streams). Off by default so repos that
      # do not use Redis do not pay for pulling the image.
      redis:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # One job rather than lint, test and secrets in parallel: GitHub rounds every
  # job up to a whole minute, so four jobs of a few seconds each were billed as
  # four minutes. The image build is not here either: build-image covers it,
  # called by each repo only on pull requests that touch how the image is
  # built, so a pull request that changes only code does not pay for it.
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history for gitleaks, which scans every commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # The steps below run even after a lint failure, so a single run reports
      # everything that is wrong instead of one push per problem.
      - if: ${{ !cancelled() }}
        run: go vet ./...
      - if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      # A container started by hand rather than a job `services:` entry: some
      # tests stop and start Redis through `docker` to exercise an outage, and
      # they need the container name, which `services:` does not let us choose.
      # The image is the one local-env runs, pinned by digest.
      #
      # GOFLAGS=-p=1 runs the packages one after another: they share this one
      # Redis, and the outage test restarting it changes the run_id under the
      # stream tests of another package running at the same time.
      - if: ${{ !cancelled() && inputs.redis }}
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          docker run -d --name redis-tests -p 127.0.0.1:6379:6379 \
            redis:8.2.10-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635 \
            redis-server --requirepass "$password" --appendonly yes --appendfsync everysec >/dev/null
          for _ in $(seq 50); do
            docker exec -e REDISCLI_AUTH="$password" redis-tests redis-cli ping >/dev/null 2>&1 && break
            sleep 0.2
          done
          docker exec -e REDISCLI_AUTH="$password" redis-tests redis-cli ping >/dev/null
          {
            echo "REDIS_TEST_URL=redis://default:$password@127.0.0.1:6379/0"
            echo "REDIS_TEST_CONTAINER=redis-tests"
            echo "GOFLAGS=-p=1"
          } >> "$GITHUB_ENV"
      - id: test
        if: ${{ !cancelled() }}
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out
      - if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "cobertura ${total}% (minimo ${THRESHOLD}%)"
          awk -v t="$total" -v m="$THRESHOLD" 'BEGIN { exit !(t+0 >= m+0) }'
      - if: ${{ !cancelled() }}
        uses: Discordia-Grupo-15/.github/.github/actions/gitleaks@main
        with:
          version: ${{ inputs.gitleaks-version }}
