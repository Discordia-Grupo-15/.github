name: CI Python

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
      coverage-threshold:
        type: number
        default: 60

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}
      - run: uv sync --all-extras --dev
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=${{ inputs.coverage-threshold }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ github.event.repository.name }}:ci

  secrets:
    uses: Discordia-Grupo-15/.github/.github/workflows/secrets-scan.yml@main
