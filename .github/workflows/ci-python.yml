name: CI Python

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
      coverage-threshold:
        type: number
        default: 60
      gitleaks-version:
        type: string
        default: "8.30.1"

permissions:
  contents: read

jobs:
  # One job rather than lint, test and secrets in parallel: GitHub rounds every
  # job up to a whole minute, so four jobs of a few seconds each were billed as
  # four minutes. The image build is not here either: build-image covers it,
  # called by each repo only on pull requests that touch how the image is
  # built, so a pull request that changes only code does not pay for it.
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history for gitleaks, which scans every commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Exact version on purpose: astral-sh/setup-uv stopped publishing the
      # moving major tag after v7, so @v10 does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      # The steps below run even after a lint failure, so a single run reports
      # everything that is wrong instead of one push per problem.
      - if: ${{ !cancelled() }}
        run: uv run ruff format --check .
      - if: ${{ !cancelled() }}
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=${{ inputs.coverage-threshold }}
      - if: ${{ !cancelled() }}
        uses: Discordia-Grupo-15/.github/.github/actions/gitleaks@main
        with:
          version: ${{ inputs.gitleaks-version }}
