name: CI Node

on:
  workflow_call:
    inputs:
      app:
        description: Workspace bajo apps/. Vacio para un repo de una sola app.
        type: string
        default: ""
      node-version:
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.app || 'check' }}
    runs-on: ubuntu-latest
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - if: inputs.app != ''
        run: npm run build --if-present --workspace packages/shared --workspace packages/api-client
      - run: |
          if [ -n "$APP" ]; then W="--workspace apps/$APP"; else W=""; fi
          npm run lint --if-present $W
          npm run typecheck --if-present $W
          npm run test --if-present $W
          npm run build --if-present $W
