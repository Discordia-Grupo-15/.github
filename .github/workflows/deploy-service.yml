name: Deploy service

# Deploys one service of the compose stack over SSH. Each service repo calls it
# with its own name, so updating identity does not restart the gateway.
#
# The host is prepared beforehand and by hand: Docker installed, the compose
# file and the .env in place, and `docker login ghcr.io` done once. This
# workflow only moves a service from one image to another.
on:
  workflow_call:
    inputs:
      service:
        description: Service name exactly as it appears in the compose file.
        type: string
        required: true
      extra_services:
        description: >-
          Space separated services that run this same image and its tag
          variable, recreated together with the service. Empty for most repos.
        type: string
        default: ""
      compose_dir:
        description: Directory on the host holding the compose file and the .env.
        type: string
        default: /opt/discordia
      compose_file:
        type: string
        default: compose.prod.yaml
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SERVICE: ${{ inputs.service }}
          EXTRA: ${{ inputs.extra_services }}
          DIR: ${{ inputs.compose_dir }}
          FILE: ${{ inputs.compose_file }}
        run: |
          set -euo pipefail

          install -m 600 /dev/null key
          echo "$SSH_KEY" > key

          # The tag publish-image.yml puts on every build: sha- plus the first
          # seven characters of the commit. It never moves, so whatever ends up
          # running can be traced back to one exact commit.
          TAG="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"

          # One tag variable per service, derived from its name:
          # identity-service -> IDENTITY_SERVICE_TAG. A single shared IMAGE_TAG
          # would apply to every image in the file, and since each repo tags with
          # its own commits, deploying gateway would make Compose resolve
          # identity-service at gateway's sha and fail with "not found".
          VAR="$(printf '%s' "$SERVICE" | tr 'a-z-' 'A-Z_')_TAG"

          # Services that share the image and its tag variable, like identity's
          # recovery worker. Deploying only the main one left them running the
          # previous build next to the new one until someone recreated them by
          # hand. Naming a service on the command line starts it even when it
          # sits in a compose profile, so the profile need not be enabled.
          SERVICES="$SERVICE${EXTRA:+ $EXTRA}"

          # The tag is written into the host's .env instead of being passed
          # inline, because an inline variable only lives for the length of this
          # command. Once it is gone, the compose file falls back to its default
          # of a moving tag, and `up -d` reuses whatever image that name points
          # at on that disk. It never pulls, so it silently keeps an old build:
          # that is how identity-service ran five-day-old code for two days
          # while its deploys reported success.
          #
          # Rewriting the file rather than appending keeps one line per service
          # however many times this runs, and leaves the .env readable as the
          # record of what is deployed.
          #
          # --wait blocks until the container reports healthy and exits non zero
          # if it never does, so a deploy that starts a broken image fails here
          # instead of going green while the service crashloops.
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd '$DIR' \
             && touch .env \
             && { grep -v '^$VAR=' .env; printf '%s=%s\n' '$VAR' '$TAG'; } > .env.tmp \
             && mv .env.tmp .env \
             && docker compose -f '$FILE' pull $SERVICES \
             && docker compose -f '$FILE' up -d --wait $SERVICES"
